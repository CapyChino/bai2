<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murach Survey</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main class="survey-container">

        <header class="hero">
            <img src="image/images.png" alt="Murach Logo" class="logo">
            <div class="hero-text">
                <h1>Survey</h1>
                <p class="intro-text">If you have a moment, we'd appreciate it if you would fill out this survey.</p>
            </div>
        </header>

        <form action="emailList" method="POST" class="survey-card">

            <div class="form-grid">

                <div class="col">
                    <section class="form-section">
                        <h2>Your information</h2>

                        <div class="input-group">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" placeholder="Nguyễn" required>
                        </div>
                        <div class="input-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" placeholder="Văn A" required>
                        </div>
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="input-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob">
                        </div>
                    </section>

                    <section class="form-section">
                        <h2>Contact method</h2>
                        <div class="contact-method">
                            <label for="contactBy">Please contact me by:</label>
                            <select name="contactBy" id="contactBy">
                                <option value="email_or_postal">Email or postal mail</option>
                                <option value="email">Email</option>
                                <option value="postal">Postal mail</option>
                            </select>
                        </div>
                    </section>
                </div>

                <div class="col">
                    <section class="form-section">
                        <h2>How did you hear about us?</h2>
                        <div class="radio-group">
                            <label><input type="radio" name="hearAbout" value="search" checked> Search engine</label>
                            <label><input type="radio" name="hearAbout" value="word"> Word of mouth</label>
                            <label><input type="radio" name="hearAbout" value="social"> Social Media</label>
                            <label><input type="radio" name="hearAbout" value="other"> Other</label>
                        </div>
                    </section>

                    <section class="form-section">
                        <h2>Announcements</h2>
                        <p class="section-hint">Would you like to receive announcements about new CDs and special offers?</p>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="announcements" value="like"> YES, I'd like that.</label>
                            <label><input type="checkbox" name="announcements" value="email_announcements"> YES, please send me email announcements.</label>
                        </div>
                    </section>
                </div>

            </div>

            <div class="submit-row">
                <button type="submit" class="submit-btn">Submit Survey</button>
            </div>
        </form>
    </main>
</body>
</html>
