<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murach Survey</title>
    <link rel="stylesheet" href="styles/main.css?v=4">
</head>
<body>
    <main class="survey-container">

        <div class="survey-card">

            <header class="hero">
                <img src="image/images.png" alt="Murach Logo" class="logo">
                <div class="hero-text">
                    <h1>Survey</h1>
                    <p class="intro-text">If you have a moment, we'd appreciate it if you would fill out this survey.</p>
                </div>
            </header>

            <form action="emailList" method="POST" class="form-body">

                <div class="form-grid">

                    <div class="col">
                        <section class="form-section">
                            <h2>Your information</h2>

                            <div class="input-group">
                                <label for="firstName">First Name</label>
                                <input type="text" id="firstName" name="firstName" placeholder="Nguyễn" required>
                            </div>
                            <div class="input-group">
                                <label for="lastName">Last Name</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Văn A" required>
                            </div>
                            <div class="input-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                            <div class="input-group">
                                <label for="dobYear">Date of Birth</label>
                                <div class="dob-row">
                                    <input type="number" id="dobDay" name="dobDay" class="dob-input"
                                           min="1" max="31" placeholder="Ngày">
                                    <input type="number" id="dobMonth" name="dobMonth" class="dob-input"
                                           min="1" max="12" placeholder="Tháng">
                                    <input type="number" id="dobYear" name="dobYear" class="dob-input dob-year"
                                           min="1900" max="2026" placeholder="Năm">
                                </div>
                                <input type="hidden" name="dob" id="dob">
                            </div>
                        </section>

                        <section class="form-section">
                            <h2>Contact method</h2>
                            <div class="contact-method">
                                <label for="contactBy">Please contact me by:</label>
                                <select name="contactBy" id="contactBy">
                                    <option value="email_or_postal">Email or postal mail</option>
                                    <option value="email">Email</option>
                                    <option value="postal">Postal mail</option>
                                </select>
                            </div>
                        </section>
                    </div>

                    <div class="col">
                        <section class="form-section">
                            <h2>How did you hear about us?</h2>
                            <div class="radio-group">
                                <label><input type="radio" name="hearAbout" value="search" checked> Search engine</label>
                                <label><input type="radio" name="hearAbout" value="word"> Word of mouth</label>
                                <label><input type="radio" name="hearAbout" value="social"> Social Media</label>
                                <label><input type="radio" name="hearAbout" value="other"> Other</label>
                            </div>
                        </section>

                        <section class="form-section">
                            <h2>Announcements</h2>
                            <p class="section-hint">Would you like to receive announcements about new CDs and special offers?</p>
                            <div class="checkbox-group">
                                <label><input type="checkbox" name="announcements" value="like"> YES, I'd like that.</label>
                                <label><input type="checkbox" name="announcements" value="email_announcements"> YES, please send me email announcements.</label>
                            </div>
                        </section>
                    </div>

                </div>

                <div class="submit-row">
                    <button type="submit" class="submit-btn">Submit Survey</button>
                </div>
            </form>

            <script>
                // Ghép ngày/tháng/năm thành dob (YYYY-MM-DD) như input type="date" cũ
                (function () {
                    var ids = ['dobDay', 'dobMonth', 'dobYear'];
                    var inputs = ids.map(function (id) { return document.getElementById(id); });
                    var dob = document.getElementById('dob');
                    function sync() {
                        var v = ids.map(function (_, i) { return inputs[i].value; });
                        dob.value = v[0] && v[1] && v[2]
                            ? v[2].padStart(4, '0') + '-' + v[1].padStart(2, '0') + '-' + v[0].padStart(2, '0')
                            : '';
                    }
                    inputs.forEach(function (i) { i.addEventListener('input', sync); });
                })();
            </script>
        </div>
    </main>
</body>
</html>
